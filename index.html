<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Projeto Web</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <header class="topo">
    <h1>Meu Projeto Web</h1>
    <p>Um exemplo prático com HTML, CSS e JavaScript</p>
  </header>

  <main class="conteudo">
    <section class="cartao">
      <h2>Bem-vindo!</h2>
      <p>
        Este site foi criado para praticar a organização de arquivos,
        a estilização de páginas e a interação com JavaScript.
      </p>
      <img
        src="imagens/paisagem.svg"
        alt="Paisagem escolhida para o projeto"
        class="imagem"
      >
      <p id="mensagem">Clique no botão para ver uma interação.</p>
      <button id="botaoMensagem" type="button">Clique aqui</button>
    </section>
  </main>

  <footer class="rodape">
    <p>Projeto educativo desenvolvido no Visual Studio Code.</p>
  </footer>
</body>
</html>
